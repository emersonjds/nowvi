[package]
name = "nowvi-api"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "time", "sync", "process", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
